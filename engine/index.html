<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3쿠션 물리 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D table; floating top bar; control panel docked right (landscape) or bottom sheet (portrait). Single dark billiard-hall look. */
[hidden]{display:none!important}
:root{--bg:#0d1116;--panel:rgba(22,28,36,.92);--line:#2f3b4b;--fg:#e9eef4;--muted:#93a1b3;--brass:#d6a54a;--good:#4cc38a;--bad:#e2675b;--ink:#1b1408;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;--f-num:"Barlow Condensed","IBM Plex Sans KR",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;margin:0}
#app{position:relative;height:100%;display:grid;grid-template-columns:1fr 268px}
#view{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#live{position:absolute;left:max(6px,env(safe-area-inset-left,0px));bottom:6px;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
#topbar{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:max(6px,env(safe-area-inset-left,0px));right:6px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#topbar>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--fg)}
#verdict{font-weight:700}
#verdict.good{color:var(--good);border-color:var(--good)} #verdict.bad{color:var(--bad)}
#busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px}
#panel{background:#161c24;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-height:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow:hidden}
#panel .lbl{display:inline-flex;align-items:center;gap:5px}
#menu button{padding:5px 0;font-size:12px}
.col{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.sm{padding:4px 6px;font-size:12px}
.chipbtn{padding:1px 8px;border-radius:999px;font-size:11px}
#spinWrap{gap:8px}
#spin{width:72px;height:72px}
.thkrow{display:grid;grid-template-columns:30px 1fr 30px;gap:4px;align-items:stretch}
#thk{width:100%;height:46px;touch-action:none;border-radius:6px;background:#0f141b;border:1px solid var(--line);min-width:0}
#angBtns button{padding:5px 0}
#shotRow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:4px}
#shotRow button{padding:4px 0;font-size:11px;line-height:1.15}
#shotRow #shoot{font-size:17px}
#drawer{position:absolute;inset:0 268px 0 0;background:rgba(14,18,24,.97);z-index:6;display:flex;flex-direction:column;padding:8px max(12px,env(safe-area-inset-left,0px));min-height:0}
#drawer .tab{padding:6px 0}
.dhead{padding-bottom:6px;border-bottom:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);flex:none}
#tabs button{border:0;border-radius:0;background:none;color:var(--muted);padding:9px 0;font-size:13px}
#tabs button[aria-selected="true"]{color:var(--brass);box-shadow:inset 0 -2px 0 var(--brass)}
.tab{padding:8px 10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0;flex:1}
.lbl{font-size:11px;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.num{font-family:var(--f-num);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--fg);background:#26303d;border:1px solid var(--line);border-radius:6px;padding:7px 0;font-size:13px;touch-action:manipulation}
button:active{background:#344258} button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#shoot{background:var(--brass);color:var(--ink);font-weight:700;font-size:16px;border:0;padding:11px 0}
#spinWrap{display:flex;gap:10px;align-items:center}
#spin{width:96px;height:96px;flex:none;touch-action:none;border-radius:50%}
input[type=range]{width:100%;accent-color:var(--brass);margin:2px 0}
select{font:inherit;background:#0f141b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.ev{font-size:12px;font-variant-numeric:tabular-nums;border-collapse:collapse;width:100%}
.ev td{padding:3px 2px;border-bottom:1px solid var(--line)} .ev td:last-child{text-align:right}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px} .kv b{text-align:right;font-family:var(--f-num);font-size:14px;font-weight:700}
@media (orientation:portrait){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{border-left:0;border-top:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  #drawer{inset:0 0 auto 0;bottom:auto;height:58%}
}
.field{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:12px}
.field input{font:inherit;width:100%;background:#0f141b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-width:0}
#topbar>.chip[aria-pressed="false"]{opacity:.55;border-style:dashed}
#topbar>.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.seg3{display:inline-flex;gap:3px}
.chipbtn[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.g5 button{padding:4px 0}
#spinPad{flex:1;min-height:44px;flex-direction:column;gap:1px;border:1px dashed var(--line);border-radius:8px;background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(255,255,255,.04) 11px 12px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.04) 11px 12px),#0f141b;
  touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);line-height:1.3;user-select:none}
#spinPad.on{border-color:var(--brass);color:var(--brass)}
#spinBtns button{padding:3px 0;font-size:11px}
#spinPad b{color:var(--fg);font-size:15px}
#menu .chip{padding:5px 10px}
.elevRow{display:grid;grid-template-columns:auto 1fr 34px;gap:8px;align-items:center}
.elevRow .num{text-align:right}
#menu .chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
@media (orientation:landscape) and (max-height:390px){#spin{width:60px;height:60px}#spinPad{min-height:36px}#panel{gap:3px;padding-top:4px}#thk{height:38px}#shotRow #shoot{font-size:15px}#angBtns button{padding:3px 0}}
#thkTxt{font-size:13px;text-align:right}
#aimModeBtn{border-color:var(--brass);color:var(--fg);background:#2a2618}
.z-ok{color:var(--fg)} .z-max{color:#e8b04a!important} .z-ext{color:var(--bad)!important}
#spinPad.z-max{border-color:#e8b04a;border-style:solid} #spinPad.z-ext{border-color:var(--bad);border-style:solid;background-color:rgba(226,103,91,.12)}
#pow{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;opacity:.9}
#pow::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#f4f2ec;border:2px solid #1b1408;box-shadow:0 1px 3px #000}
#pow::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#f4f2ec;border:2px solid #1b1408}
</style>
</head><body>
<div id="app">
  <div id="view">
    <canvas id="cv" aria-label="당구대 (위에서 본 모습)"></canvas>
    <div id="topbar">
      <span id="menu" class="seg3"><button type="button" class="chip" data-t="place">배치</button><button type="button" class="chip" data-t="phys">물리</button><button type="button" class="chip" data-t="info">기록</button></span>
      <button class="chip mode" id="aimModeBtn" type="button">조준: 진행 쪽 터치</button>
      <button class="chip" id="pathBtn" type="button" aria-pressed="true">궤적 켜짐</button>
      <button class="chip" id="ghostBtn" type="button" aria-pressed="true">이전 샷 겹쳐보기</button>
      <button class="chip" id="guideBtn" type="button" aria-pressed="true">가이드</button>
      <button class="chip" id="numBtn" type="button" aria-pressed="true">다이아 숫자</button>
      <button class="chip" id="soundBtn" type="button" aria-pressed="true">소리</button>
      <span class="chip" id="verdict">샷을 쳐보세요</span>
    </div>
    <div class="chip" id="live" hidden></div>
    <div id="busy" hidden>계산 중…</div>
  </div>
  <aside id="panel">
    <div id="spinWrap"><canvas id="spin" width="168" height="168" aria-label="당점 표시"></canvas>
      <div class="col"><div id="spinPad" role="slider" aria-label="당점 패드: 문질러서 당점 이동" tabindex="0"><b id="spinTxt" class="num">중앙</b><span>여기를 문질러 당점 이동</span></div>
        <div class="g5" id="spinBtns"><button type="button" class="sm" data-da="-1" data-db="0" aria-label="당점 왼쪽">◀</button><button type="button" class="sm" data-da="0" data-db="1" aria-label="당점 위">▲</button><button id="spinReset" type="button" class="sm" aria-label="당점 중앙">●</button><button type="button" class="sm" data-da="0" data-db="-1" aria-label="당점 아래">▼</button><button type="button" class="sm" data-da="1" data-db="0" aria-label="당점 오른쪽">▶</button></div></div></div>
    <div class="elevRow"><span class="lbl">기울기</span><input id="elev" type="range" min="3" max="75" step="1" value="5" aria-label="큐 기울기"><span class="num" id="elevTxt"></span></div>
    <div><div class="row"><span class="lbl">힘 <span id="strokeSeg" class="seg3"><button type="button" class="sm chipbtn" data-s="push" aria-pressed="false">밀어</button><button type="button" class="sm chipbtn" data-s="normal" aria-pressed="true">보통</button><button type="button" class="sm chipbtn" data-s="snap" aria-pressed="false">끊어</button></span></span><span class="num" id="powTxt"></span></div><input id="pow" type="range" min="0" max="1000" step="1" value="380" aria-label="힘"></div>
    <div id="thick"><div class="row"><span class="lbl">두께 · 1적구 <button type="button" id="tgt" class="sm chipbtn">빨강</button></span><span class="num" id="thkTxt"></span></div>
      <div class="thkrow"><button type="button" class="sm" data-k="-1" aria-label="두께 왼쪽으로">‹</button><canvas id="thk" width="400" height="96" aria-label="두께 조절: 좌우로 끌기"></canvas><button type="button" class="sm" data-k="1" aria-label="두께 오른쪽으로">›</button></div></div>
    <div><div class="row"><span class="lbl">각도</span><span class="num" id="angTxt"></span></div>
      <div class="g4" id="angBtns"><button type="button" data-d="-1">◀◀</button><button type="button" data-d="-0.05">◀</button><button type="button" data-d="0.05">▶</button><button type="button" data-d="1">▶▶</button></div></div>
    <div id="shotRow"><button id="shoot" type="button">샷</button><button id="retry" type="button">같은<br>배치</button><button id="replay" type="button">리플<br>레이</button><button id="rspeed" type="button">1x</button></div>
  </aside>
  <div id="drawer" hidden>
    <div class="row dhead"><strong id="dTitle"></strong><button type="button" id="dClose" class="sm">닫기</button></div>
    <section class="tab" id="t-place" hidden>
      <div class="g2"><button type="button" id="pBreak">초구 배치</button><button type="button" id="pRandom">랜덤 배치</button></div>
      <button type="button" id="pEdit" aria-pressed="false">공 옮기기 켜기</button>
      <button type="button" id="pSnap" aria-pressed="true">0.25 다이아 단위로 맞춤</button>
      <div class="field" id="posFields"></div>
      <p class="note">위치는 다이아몬드 단위입니다. 가로 0~8 (왼쪽 단쿠션 0), 세로 0~4 (아래 장쿠션 0). 공 옮기기를 켠 채로 닫으면 당구대에서 공을 끌어 옮길 수 있습니다.</p>
    </section>
    <section class="tab" id="t-phys" hidden>
      <div><span class="lbl">테이블 컨디션</span>
        <select id="cond" aria-label="테이블 컨디션"><option value="fast">빠른 대 (잘 구름)</option><option value="normal" selected>보통</option><option value="slow">무거운 대</option></select></div>
      <div id="sliders" class="sgrid"></div>
      <button type="button" id="physReset">기본값으로</button>
    </section>
    <section class="tab" id="t-info" hidden>
      <div class="kv" id="shotInfo"><span>아직 친 샷이 없습니다</span></div>
      <table class="ev"><tbody id="evList"></tbody></table>
    </section>
  </div>
</div>
<script>
/* =====================================================================
   Carom 3-Cushion Physics Core (3D rigid balls, deterministic)
   Coordinate frame: x = long axis [0,L], y = short axis [0,W], z = up.
   References:
   - Cloth: sliding / rolling / spinning model (Leckie & Greenspan; pooltool)
   - Cue: impulse along cue axis at tip contact, cue elevation, squirt (Alciatore)
   - Ball-ball: impulse with speed-dependent friction -> cut/spin throw (Alciatore)
   - Cushion: impulse integration with cushion & table friction, energy restitution
     (Mathavan, Jackson & Parkin 2010)
   ===================================================================== */
const BilliardPhysics = (() => {
  const DEFAULTS = {
    // 한국 일반 당구장 국내식 중대: 내경 2448 x 1224 mm, 4구/3구 겸용 쿠션 높이 40mm, 3구 공 61.5mm
    R: 0.03075, m: 0.21, L: 2.448, W: 1.224, g: 9.81,
    muS: 0.20,            // cloth sliding friction
    muR: 0.0085,          // cloth rolling resistance
    spinDecel: 10.0,      // rad/s^2, vertical-axis spin decay on cloth
    eBall: 0.94,          // ball-ball restitution
    ballMuA: 9.951e-3, ballMuB: 0.108, ballMuC: 1.088, // ball-ball friction mu(v)=a+b*exp(-c v)
    cushionH: 0.040,      // cushion nose height from cloth (중대 겸용 40mm, 3구 전용 38mm)
    eCushion: 0.86,       // cushion restitution (energy based)
    muCushion: 0.16,      // ball-cushion friction
    muTableImpact: 0.20,  // ball-cloth friction during cushion impact
    eTable: 0.45,         // ball-slate bounce restitution (landing)
    cueMass: 0.52, cueTipE: 0.78, cueEndMass: 0.005, // 캐롬 저반발(LD) 샤프트 수준 miscue: 0.62,
    // 스트로크: 유효 큐 질량(그립·손목이 함께 미는 정도), 팁 반발, 현장 체감 회전 보정
    // 스트로크 (현장 지도서 공통 내용 반영):
    //  밀어치기(가속하며 통과): 큐가 공을 오래 밀어 '전진력' 추가 → 앞으로 잘 밀림, 하단은 덜 끌려옴, 진로 길고 힘참, 회전 영향은 상대적으로 작음
    //  끊어치기(임팩트 직후 정지): 전진력 억제(스턴 성향) → 분리각 커짐, 진로 짧고 약함, 하단은 강하게 끌려옴, 회전 변화 극적
    //  roll: 자연 구름 대비 추가 전진회전 비율, spin: 당점 회전 배율, mass/tipE: 유효 큐 질량·팁 반발
    strokes: { push: { mass: 0.66, tipE: 0.80, roll: 0.22, spin: 0.90 }, normal: { mass: 0.52, tipE: 0.78, roll: 0, spin: 1 }, snap: { mass: 0.44, tipE: 0.70, roll: -0.18, spin: 1.15 } },
    strokeFeel: 1.0,      // 0 = 순수 충격량 물리만, 1 = 지도서 기준 효과 전부
    dt: 1e-4, recordHz: 240, maxTime: 40
  };

  // ---------- small vector helpers (arrays [x,y,z]) ----------
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);

  function makeBall(id, x, y, P) {
    return { id, x, y, z: P.R, vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0,
             q: [1, 0, 0, 0], air: false, still: true };
  }

  function ballMu(P, v) { return P.ballMuA + P.ballMuB * Math.exp(-P.ballMuC * v); }

  // ---------- cue strike ----------
  // shot: {phi (rad), V (cue speed m/s), a (side, +right, fraction of R), b (vertical, +top, fraction of R), elev (rad)}
  function strike(P, ball, shot) {
    const { R, m } = P, I = 0.4 * m * R * R;
    let a = shot.a || 0, b = shot.b || 0;
    const off = Math.hypot(a, b); let miscue = false;
    if (off > P.miscue) { miscue = true; a *= P.miscue / off; b *= P.miscue / off; }
    const ce = Math.cos(shot.elev || 0), se = Math.sin(shot.elev || 0);
    const d = [ce * Math.cos(shot.phi), ce * Math.sin(shot.phi), -se];
    const rgt = [Math.sin(shot.phi), -Math.cos(shot.phi), 0];
    const up = cross(rgt, d);
    const c = Math.sqrt(Math.max(0, 1 - a*a - b*b)) * R;
    const p = [0, 1, 2].map(k => a*R*rgt[k] + b*R*up[k] - c*d[k]);
    const pxd = cross(p, d);
    const invMeff = 1/m + dot(pxd, pxd) / I;
    const S = (P.strokes && P.strokes[shot.stroke || 'normal']) || { mass: P.cueMass, tipE: P.cueTipE, roll: 0, spin: 1 };
    const cueM = shot.stroke && shot.stroke !== 'normal' ? S.mass : P.cueMass, tipE = shot.stroke && shot.stroke !== 'normal' ? S.tipE : P.cueTipE;
    let J = (1 + tipE) * shot.V / (1/cueM + invMeff);
    if (miscue) J *= 0.35;
    const Jv = d.map(k => k * J);
    ball.vx += Jv[0]/m; ball.vy += Jv[1]/m; ball.vz += Jv[2]/m;
    const dw = cross(p, Jv);
    const fe = P.strokeFeel || 0, sk = 1 + ((S.spin || 1) - 1) * fe, rk = (S.roll || 0) * fe;
    ball.wx += sk * dw[0]/I; ball.wy += sk * dw[1]/I; ball.wz += sk * dw[2]/I;
    // 전진력(+)/스턴(-) 성분: 진행 방향 자연 구름 회전의 일정 비율을 더하거나 뺌
    ball.wx += rk * (-ball.vy / R); ball.wy += rk * (ball.vx / R);
    // squirt: cue ball deflects away from the side of english
    const aa = Math.max(-0.95, Math.min(0.95, a));
    const sq = Math.atan(2.5 * Math.abs(aa) * Math.sqrt(1 - aa*aa) / (1 + m / P.cueEndMass + 2.5 * (1 - aa*aa))) * Math.sign(aa);
    const cs = Math.cos(sq), sn = Math.sin(sq);
    const vx = ball.vx * cs - ball.vy * sn, vy = ball.vx * sn + ball.vy * cs;
    ball.vx = vx; ball.vy = vy;
    // downward component goes into the slate (no jump for normal elevations)
    if (ball.vz < 0) ball.vz = 0;  // 큐의 하향 성분은 슬레이트가 흡수 (점프샷은 추후)
    if (ball.vz > 0.05) ball.air = true;
    ball.still = false;
    return { miscue, squirtDeg: sq * 180 / Math.PI };
  }

  // ---------- cloth interaction for one step ----------
  function cloth(P, b, dt) {
    const { R, g } = P;
    if (b.air) { b.vz -= g * dt; return; }
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, u = Math.hypot(ux, uy);

  const cush = res.events.filter(e => e.type === 'cushion' && e.i === 0).slice(0, 6).map((e, k) => `${k + 1}쿠션 ${RAILNAME[e.side].replace('쿠션', '')} ${railPoint(res, e)}`);
  $('shotInfo').innerHTML = [['조준', res.aimDia || '-'], ['큐 속도', s.V.toFixed(2) + ' m/s'], ['수구 초속', cueV.toFixed(2) + ' m/s'], ['스트로크', { push: '밀어치기', normal: '보통', snap: '끊어치기' }[s.stroke || 'normal']], ['당점', spinLabel(s.a, s.b)], ['큐 기울기', Math.round(s.elev * 180 / Math.PI) + '°'],
    ['스쿼트', res.strike.squirtDeg.toFixed(2) + '°' + (res.strike.miscue ? ' · 미스큐!' : '')], ['진행 시간', res.duration.toFixed(1) + ' 초'], ['계산 시간', Math.round(res.calcMs) + ' ms']].map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('')
    + (cush.length ? `<span>수구 쿠션 지점</span><b style="font-size:12px;line-height:1.5">${cush.join('<br>')}</b>` : '');
  $('evList').innerHTML = res.events.filter(e => e.type !== 'land' || e.speed > 0.3).slice(0, 60).map(e => `<tr><td>${e.t.toFixed(2)}s</td><td>${e.type === 'ball' ? NAMES[e.i] + '↔' + NAMES[e.j] : e.type === 'cushion' ? NAMES[e.i] + ' → ' + RAILNAME[e.side] + ' ' + railPoint(res, e) : NAMES[e.i] + ' 착지'}</td><td>${e.speed.toFixed(2)} m/s</td></tr>`).join(''); }

/* ---------- loop ---------- */
let lastT = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; if (play) stepPlay(dt); requestAnimationFrame(frame); }
buildSliders(); buildPos(); drawSpin(); powTrack(); ui();
document.addEventListener('pointerdown', () => { if (st.sound) { const C = audioInit(); C && C.state === 'suspended' && C.resume(); } }, { once: true }); resize(); requestAnimationFrame(frame);
</script></body></html>
