<title>3쿠션 엔진 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D table; floating top bar; control panel docked right (landscape) or bottom sheet (portrait). Single dark billiard-hall look. */
[hidden]{display:none!important}
:root{--bg:#0d1116;--panel:rgba(22,28,36,.92);--line:#2f3b4b;--fg:#e9eef4;--muted:#93a1b3;--brass:#d6a54a;--good:#4cc38a;--bad:#e2675b;--ink:#1b1408;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif;--f-num:"Barlow Condensed","IBM Plex Sans KR",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;margin:0}
#app{position:relative;height:100%;display:grid;grid-template-columns:1fr 232px}
#view{position:relative;min-width:0;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#topbar{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:max(6px,env(safe-area-inset-left,0px));right:6px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#topbar>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--fg)}
#verdict{font-weight:700}
#verdict.good{color:var(--good);border-color:var(--good)} #verdict.bad{color:var(--bad)}
#busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px}
#panel{background:#161c24;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);flex:none}
#tabs button{border:0;border-radius:0;background:none;color:var(--muted);padding:9px 0;font-size:13px}
#tabs button[aria-selected="true"]{color:var(--brass);box-shadow:inset 0 -2px 0 var(--brass)}
.tab{padding:8px 10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0;flex:1}
.lbl{font-size:11px;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.num{font-family:var(--f-num);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
button{font:inherit;color:var(--fg);background:#26303d;border:1px solid var(--line);border-radius:6px;padding:7px 0;font-size:13px;touch-action:manipulation}
button:active{background:#344258} button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#shoot{background:var(--brass);color:var(--ink);font-weight:700;font-size:16px;border:0;padding:11px 0}
#spinWrap{display:flex;gap:10px;align-items:center}
#spin{width:96px;height:96px;flex:none;touch-action:none;border-radius:50%}
input[type=range]{width:100%;accent-color:var(--brass);margin:2px 0}
select{font:inherit;background:#0f141b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.ev{font-size:12px;font-variant-numeric:tabular-nums;border-collapse:collapse;width:100%}
.ev td{padding:3px 2px;border-bottom:1px solid var(--line)} .ev td:last-child{text-align:right}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px} .kv b{text-align:right;font-family:var(--f-num);font-size:14px;font-weight:700}
@media (orientation:portrait){
  #app{grid-template-columns:1fr;grid-template-rows:1fr minmax(0,44%)}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .tab{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
}
</style>
<div id="app">
  <div id="view">
    <canvas id="gl" aria-label="3D 당구대"></canvas>
    <div id="topbar">
      <button class="chip" id="camBtn" type="button">시점: 조준</button>
      <button class="chip" id="pathBtn" type="button" aria-pressed="true">궤적</button>
      <button class="chip" id="guideBtn" type="button" aria-pressed="true">가이드</button>
      <button class="chip" id="soundBtn" type="button" aria-pressed="true">소리</button>
      <span class="chip" id="verdict">샷을 쳐보세요</span>
    </div>
    <div id="busy" hidden>계산 중…</div>
  </div>
  <aside id="panel">
    <div id="tabs" role="tablist">
      <button type="button" role="tab" data-t="shot" aria-selected="true">샷</button>
      <button type="button" role="tab" data-t="place">배치</button>
      <button type="button" role="tab" data-t="phys">물리</button>
      <button type="button" role="tab" data-t="info">기록</button>
    </div>
    <section class="tab" id="t-shot">
      <div id="spinWrap"><canvas id="spin" width="192" height="192" aria-label="당점"></canvas>
        <div style="display:flex;flex-direction:column;gap:4px;flex:1"><span class="lbl">당점</span><span id="spinTxt" class="num">중앙</span><button id="spinReset" type="button">중앙</button></div></div>
      <div><div class="row"><span class="lbl">큐 기울기</span><span class="num" id="elevTxt"></span></div><input id="elev" type="range" min="0" max="75" step="1" value="5" aria-label="큐 기울기"></div>
      <div><div class="row"><span class="lbl">힘 (큐 속도)</span><span class="num" id="powTxt"></span></div><input id="pow" type="range" min="0" max="1000" step="1" value="380" aria-label="힘"></div>
      <div><div class="row"><span class="lbl">조준 미세조정</span><span class="num" id="angTxt"></span></div>
        <div class="g4"><button type="button" data-d="-1">◀◀</button><button type="button" data-d="-0.05">◀</button><button type="button" data-d="0.05">▶</button><button type="button" data-d="1">▶▶</button></div></div>
      <button id="shoot" type="button">샷</button>
      <div class="g3"><button id="retry" type="button">같은 배치</button><button id="replay" type="button">리플레이</button><button id="rspeed" type="button">1x</button></div>
      <p class="note">조준 시점: 화면을 좌우로 끌면 조준, 위아래로 끌면 시선 높이, 두 손가락으로 확대. 위에서 보기: 화면을 누른 곳으로 조준.</p>
    </section>
    <section class="tab" id="t-place" hidden>
      <div class="g2"><button type="button" id="pBreak">초구 배치</button><button type="button" id="pRandom">랜덤 배치</button></div>
      <button type="button" id="pEdit" aria-pressed="false">공 옮기기 켜기</button>
      <p class="note">공 옮기기를 켜면 위에서 보기로 바뀝니다. 공을 손가락으로 끌어 원하는 곳에 놓으세요. 흰 공이 수구입니다.</p>
    </section>
    <section class="tab" id="t-phys" hidden>
      <div><span class="lbl">테이블 컨디션</span>
        <select id="cond" aria-label="테이블 컨디션"><option value="fast">빠른 대 (잘 구름)</option><option value="normal" selected>보통</option><option value="slow">무거운 대</option></select></div>
      <div id="sliders" style="display:flex;flex-direction:column;gap:6px"></div>
      <button type="button" id="physReset">기본값으로</button>
    </section>
    <section class="tab" id="t-info" hidden>
      <div class="kv" id="shotInfo"><span>아직 친 샷이 없습니다</span></div>
      <table class="ev"><tbody id="evList"></tbody></table>
    </section>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   Carom 3-Cushion Physics Core (3D rigid balls, deterministic)
   Coordinate frame: x = long axis [0,L], y = short axis [0,W], z = up.
   References:
   - Cloth: sliding / rolling / spinning model (Leckie & Greenspan; pooltool)
   - Cue: impulse along cue axis at tip contact, cue elevation, squirt (Alciatore)
   - Ball-ball: impulse with speed-dependent friction -> cut/spin throw (Alciatore)
   - Cushion: impulse integration with cushion & table friction, energy restitution
     (Mathavan, Jackson & Parkin 2010)
   ===================================================================== */
const BilliardPhysics = (() => {
  const DEFAULTS = {
    R: 0.03075, m: 0.21, L: 2.84, W: 1.42, g: 9.81,
    muS: 0.20,            // cloth sliding friction
    muR: 0.0085,          // cloth rolling resistance
    spinDecel: 10.0,      // rad/s^2, vertical-axis spin decay on cloth
    eBall: 0.94,          // ball-ball restitution
    ballMuA: 9.951e-3, ballMuB: 0.108, ballMuC: 1.088, // ball-ball friction mu(v)=a+b*exp(-c v)
    cushionH: 0.037,      // cushion nose height from cloth (carom ~37mm)
    eCushion: 0.86,       // cushion restitution (energy based)
    muCushion: 0.16,      // ball-cushion friction
    muTableImpact: 0.20,  // ball-cloth friction during cushion impact
    eTable: 0.45,         // ball-slate bounce restitution (landing)
    cueMass: 0.52, cueTipE: 0.78, cueEndMass: 0.008, miscue: 0.62,
    dt: 1e-4, recordHz: 240, maxTime: 40
  };

  // ---------- small vector helpers (arrays [x,y,z]) ----------
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);

  function makeBall(id, x, y, P) {
    return { id, x, y, z: P.R, vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0,
             q: [1, 0, 0, 0], air: false, still: true };
  }

  function ballMu(P, v) { return P.ballMuA + P.ballMuB * Math.exp(-P.ballMuC * v); }

  // ---------- cue strike ----------
  // shot: {phi (rad), V (cue speed m/s), a (side, +right, fraction of R), b (vertical, +top, fraction of R), elev (rad)}
  function strike(P, ball, shot) {
    const { R, m } = P, I = 0.4 * m * R * R;
    let a = shot.a || 0, b = shot.b || 0;
    const off = Math.hypot(a, b); let miscue = false;
    if (off > P.miscue) { miscue = true; a *= P.miscue / off; b *= P.miscue / off; }
    const ce = Math.cos(shot.elev || 0), se = Math.sin(shot.elev || 0);
    const d = [ce * Math.cos(shot.phi), ce * Math.sin(shot.phi), -se];
    const rgt = [Math.sin(shot.phi), -Math.cos(shot.phi), 0];
    const up = cross(rgt, d);
    const c = Math.sqrt(Math.max(0, 1 - a*a - b*b)) * R;
    const p = [0, 1, 2].map(k => a*R*rgt[k] + b*R*up[k] - c*d[k]);
    const pxd = cross(p, d);
    const invMeff = 1/m + dot(pxd, pxd) / I;
    let J = (1 + P.cueTipE) * shot.V / (1/P.cueMass + invMeff);
    if (miscue) J *= 0.35;
    const Jv = d.map(k => k * J);
    ball.vx += Jv[0]/m; ball.vy += Jv[1]/m; ball.vz += Jv[2]/m;
    const dw = cross(p, Jv);
    ball.wx += dw[0]/I; ball.wy += dw[1]/I; ball.wz += dw[2]/I;
    // squirt: cue ball deflects away from the side of english
    const aa = Math.max(-0.95, Math.min(0.95, a));
    const sq = Math.atan(2.5 * Math.abs(aa) * Math.sqrt(1 - aa*aa) / (1 + m / P.cueEndMass + 2.5 * (1 - aa*aa))) * Math.sign(aa);
    const cs = Math.cos(sq), sn = Math.sin(sq);
    const vx = ball.vx * cs - ball.vy * sn, vy = ball.vx * sn + ball.vy * cs;
    ball.vx = vx; ball.vy = vy;
    // downward component goes into the slate (no jump for normal elevations)
    if (ball.vz < 0) ball.vz = 0;  // 큐의 하향 성분은 슬레이트가 흡수 (점프샷은 추후)
    if (ball.vz > 0.05) ball.air = true;
    ball.still = false;
    return { miscue, squirtDeg: sq * 180 / Math.PI };
  }

  // ---------- cloth interaction for one step ----------
  function cloth(P, b, dt) {
    const { R, g } = P;
    if (b.air) { b.vz -= g * dt; return; }
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, u = Math.hypot(ux, uy);
    const kSlide = P.muS * g;
    if (u > 3.5 * kSlide * dt) {
      const ax = -kSlide * ux / u, ay = -kSlide * uy / u;
      b.vx += ax * dt; b.vy += ay * dt;
      b.wx += 2.5 / R * ay * dt; b.wy -= 2.5 / R * ax * dt;
    } else {
      b.vx -= (2/7) * ux; b.vy -= (2/7) * uy;
      const sp = Math.hypot(b.vx, b.vy), dec = P.muR * g * dt;
      if (sp <= dec) { b.vx = 0; b.vy = 0; } else { b.vx *= (sp - dec) / sp; b.vy *= (sp - dec) / sp; }
      b.wx = -b.vy / R; b.wy = b.vx / R;
    }
    const dw = P.spinDecel * dt;
    b.wz = Math.abs(b.wz) <= dw ? 0 : b.wz - Math.sign(b.wz) * dw;
  }

  // ---------- landing on slate ----------
  function land(P, b, ev, t, i) {
    const { R, m } = P, I = 0.4 * m * R * R;
    b.z = R;
    const vin = -b.vz;
    const Jn = m * (1 + P.eTable) * vin;
    b.vz = P.eTable * vin;
    // friction impulse at contact (Coulomb, limited to sticking)
    const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, u = Math.hypot(ux, uy);
    if (u > 1e-9) {
      const Jt = Math.min(P.muS * Jn, m * u / 3.5);
      const fx = -Jt * ux / u, fy = -Jt * uy / u;
      b.vx += fx / m; b.vy += fy / m;
      b.wx += R * fy / I; b.wy -= R * fx / I;
    }
    if (vin > 0.15) ev.push({ t, type: 'land', i, speed: vin });
    if (b.vz < 0.06) { b.vz = 0; b.air = false; }
  }

  // ---------- ball-ball ----------
  function ballBall(P, A, B, ev, t, i, j) {
    const { R, m } = P, I = 0.4 * m * R * R;
    let nx = B.x - A.x, ny = B.y - A.y, nz = B.z - A.z; const d = Math.hypot(nx, ny, nz);
    if (d >= 2 * R || d === 0) return;
    nx /= d; ny /= d; nz /= d; const n = [nx, ny, nz];
    const vrel = [A.vx - B.vx, A.vy - B.vy, A.vz - B.vz];
    const vn = dot(vrel, n);
    // separate overlap
    const ov = (2 * R - d) / 2;
    A.x -= ov * nx; A.y -= ov * ny; B.x += ov * nx; B.y += ov * ny;
    if (vn <= 0) return;
    const Jn = (1 + P.eBall) / 2 * m * vn;
    // contact-point relative velocity: (vA - vB) + R (wA + wB) x n
    const wsum = [A.wx + B.wx, A.wy + B.wy, A.wz + B.wz];
    const wxn = cross(wsum, n);
    const u = [vrel[0] + R * wxn[0], vrel[1] + R * wxn[1], vrel[2] + R * wxn[2]];
    const un = dot(u, n); const ut = [u[0] - un*nx, u[1] - un*ny, u[2] - un*nz]; const utl = len(ut);
    let Jt = 0, th = [0, 0, 0];
    if (utl > 1e-9) { Jt = Math.min(ballMu(P, utl) * Jn, m * utl / 7); th = ut.map(k => k / utl); }
    // impulse on A: -Jn n - Jt th ; on B: opposite
    const JA = [-Jn*nx - Jt*th[0], -Jn*ny - Jt*th[1], -Jn*nz - Jt*th[2]];
    A.vx += JA[0]/m; A.vy += JA[1]/m; A.vz += JA[2]/m;
    B.vx -= JA[0]/m; B.vy -= JA[1]/m; B.vz -= JA[2]/m;
    const fA = th.map(k => -Jt * k);
    const tA = cross([R*nx, R*ny, R*nz], fA);          // torque on A from friction at +R n
    const tB = cross([-R*nx, -R*ny, -R*nz], fA.map(k => -k));
    A.wx += tA[0]/I; A.wy += tA[1]/I; A.wz += tA[2]/I;
    B.wx += tB[0]/I; B.wy += tB[1]/I; B.wz += tB[2]/I;
    for (const X of [A, B]) { X.still = false; if (!X.air && X.vz > 0.05) X.air = true; else if (!X.air) X.vz = Math.max(0, X.vz); }
    ev.push({ t, type: 'ball', i, j, speed: vn, nx, ny });
  }

  // ---------- ball-cushion (Mathavan-style impulse integration) ----------
  function cushion(P, b, n, ev, t, i, side) {
    const { R, m } = P, I = 0.4 * m * R * R;
    const sinT = Math.max(-0.95, Math.min(0.95, (P.cushionH - b.z) / R));
    const cosT = Math.sqrt(1 - sinT * sinT);
    const rI = [R * cosT * n[0], R * cosT * n[1], R * sinT];          // centre -> cushion contact
    const rh = rI.map(k => k / R);                                      // unit, pointing into cushion
    const rC = [0, 0, -R];
    const s0 = dot([b.vx, b.vy, b.vz], rh) + dot(cross([b.wx, b.wy, b.wz], rI), rh);
    if (s0 <= 0) return;
    const onTable = !b.air;
    const N = 600, dP = m * s0 / N * 1.0;
    let Wc = 0, Wr = 0, phase = 0, it = 0;
    const e2 = P.eCushion * P.eCushion;
    while (it++ < 20000) {
      const w = [b.wx, b.wy, b.wz], v = [b.vx, b.vy, b.vz];
      const uI = cross(w, rI); uI[0] += v[0]; uI[1] += v[1]; uI[2] += v[2];
      const s = dot(uI, rh);
      if (phase === 0) { if (s <= 0) phase = 1; else Wc += s * dP; }
      if (phase === 1) { Wr += -s * dP; if (Wr >= e2 * Wc) break; }
      // normal impulse on ball (points out of cushion, into ball)
      const JN = rh.map(k => -k * dP);
      // cushion friction opposing slip at I
      const ut = [uI[0] - s * rh[0], uI[1] - s * rh[1], uI[2] - s * rh[2]]; const utl = len(ut);
      const fI = utl > 1e-9 ? ut.map(k => -P.muCushion * dP * k / utl) : [0, 0, 0];
      // slate reaction & friction
      let Pz = 0, fC = [0, 0, 0];
      const Jz = JN[2] + fI[2];
      if (onTable && b.z <= R + 1e-6 && b.vz <= 1e-6 && Jz < 0) {
        Pz = -Jz;
        const ux = b.vx - R * b.wy, uy = b.vy + R * b.wx, u = Math.hypot(ux, uy);
        if (u > 1e-9) fC = [-P.muTableImpact * Pz * ux / u, -P.muTableImpact * Pz * uy / u, 0];
      }
      const J = [JN[0] + fI[0] + fC[0], JN[1] + fI[1] + fC[1], JN[2] + fI[2] + fC[2] + Pz];
      b.vx += J[0]/m; b.vy += J[1]/m; b.vz += J[2]/m;
      const tI = cross(rI, fI), tC = cross(rC, fC);
      b.wx += (tI[0] + tC[0])/I; b.wy += (tI[1] + tC[1])/I; b.wz += (tI[2] + tC[2])/I;
    }
    if (b.vz > 0.05) b.air = true; else if (!b.air) b.vz = 0;
    b.still = false;
    ev.push({ t, type: 'cushion', i, side, speed: s0 });
  }

  // ---------- quaternion integration for visible ball rotation ----------
  function rotate(b, dt) {
    const [w, x, y, z] = b.q, ox = b.wx, oy = b.wy, oz = b.wz;
    const h = 0.5 * dt;
    const nw = w + h * (-ox*x - oy*y - oz*z), nx = x + h * (ox*w + oy*z - oz*y),
          ny = y + h * (-ox*z + oy*w + oz*x), nz = z + h * (ox*y - oy*x + oz*w);
    const l = Math.hypot(nw, nx, ny, nz); b.q = [nw/l, nx/l, ny/l, nz/l];
  }

  const SIDES = [ // [normal into cushion, axis, limit fn]
    { n: [-1, 0, 0], test: (P, b, lim) => b.x < lim, fix: (P, b, lim) => { b.x = lim; } },
    { n: [ 1, 0, 0], test: (P, b, lim) => b.x > P.L - lim, fix: (P, b, lim) => { b.x = P.L - lim; } },
    { n: [ 0,-1, 0], test: (P, b, lim) => b.y < lim, fix: (P, b, lim) => { b.y = lim; } },
    { n: [ 0, 1, 0], test: (P, b, lim) => b.y > P.W - lim, fix: (P, b, lim) => { b.y = P.W - lim; } },
  ];

  function moving(P, b) {
    return b.air || Math.hypot(b.vx, b.vy) > 1e-3 || Math.abs(b.wz) > 0.3 ||
      Math.hypot(b.vx - P.R * b.wy, b.vy + P.R * b.wx) > 2e-3;

$('spinReset').onclick = () => { st.a = st.b = 0; drawSpin(); ui(); };
$('elev').oninput = e => { st.elev = +e.target.value; ui(); };
$('pow').oninput = e => { st.power = e.target.value / 1000; ui(); };
document.querySelectorAll('#t-shot .g4 button').forEach(b => { let t1, t2; const go = () => { if (play) return; st.phi += parseFloat(b.dataset.d) * Math.PI / 180; ui(); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); go(); t1 = setTimeout(() => { t2 = setInterval(go, 50); }, 350); });
  const stop = () => { clearTimeout(t1); clearInterval(t2); }; ['pointerup', 'pointerleave', 'pointercancel'].forEach(k => b.addEventListener(k, stop)); });
function spinLabel(a, b) { const s = []; if (b > 0.02) s.push('위 ' + Math.round(b * 100)); if (b < -0.02) s.push('아래 ' + Math.round(-b * 100)); if (a > 0.02) s.push('우 ' + Math.round(a * 100)); if (a < -0.02) s.push('좌 ' + Math.round(-a * 100)); return s.join(' · ') || '중앙'; }
function ui() { $('spinTxt').textContent = spinLabel(st.a, st.b); $('elevTxt').textContent = st.elev + '°';
  $('powTxt').textContent = Math.round(st.power * 100) + '% · ' + cueSpeed(st.power).toFixed(2) + ' m/s';
  $('angTxt').textContent = (((st.phi * 180 / Math.PI) % 360 + 360) % 360).toFixed(2) + '°';
  $('shoot').disabled = !!play || st.edit; $('replay').disabled = !last || !!play; $('retry').disabled = !before || !!play; }
const toggle = (id, key, after) => { $(id).onclick = e => { st[key] = !st[key]; e.currentTarget.setAttribute('aria-pressed', st[key]); after && after(); }; };
toggle('guideBtn', 'guide'); toggle('pathBtn', 'path', () => pathLines.forEach(l => l.visible = st.path)); toggle('soundBtn', 'sound');
$('rspeed').onclick = e => { st.rspeed = { 1: 0.5, 0.5: 0.25, 0.25: 0.1, 0.1: 2, 2: 1 }[st.rspeed]; e.currentTarget.textContent = st.rspeed + 'x'; if (play) play.speed = st.rspeed; };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.tab').forEach(t => t.hidden = t.id !== 't-' + b.dataset.t); });
function setEdit(on) { st.edit = on; $('pEdit').setAttribute('aria-pressed', on); $('pEdit').textContent = on ? '공 옮기기 끄기' : '공 옮기기 켜기'; if (on) { st.cam = 'top'; $('camBtn').textContent = camLabel(); } ui(); }
$('pEdit').onclick = () => setEdit(!st.edit);
$('pBreak').onclick = () => { if (play) return; balls = breakBalls(); aimAt(2); syncBalls(); clearPaths(); };
$('pRandom').onclick = () => { if (play) return; balls = breakBalls(); for (let k = 0; k < 3; k++) { let ok = false; while (!ok) { const x = 0.1 + Math.random() * (L - 0.2), y = 0.1 + Math.random() * (W - 0.2); ok = balls.every((b, i) => i >= k || Math.hypot(b.x - x, b.y - y) > 0.15); if (ok) { balls[k].x = x; balls[k].y = y; } } } aimAt(1); syncBalls(); clearPaths(); };
// physics sliders
function buildSliders() { $('sliders').innerHTML = SLIDERS.map(([k, label, mn, mx, stp, mul]) => `<div><div class="row"><span class="lbl">${label}</span><span class="num" id="v-${k}"></span></div><input type="range" id="s-${k}" min="${mn}" max="${mx}" step="${stp}" value="${params[k]}" aria-label="${label}"></div>`).join('');
  SLIDERS.forEach(([k, , , , stp, mul]) => { const el = $('s-' + k); const show = () => { const v = params[k] * (mul || 1); $('v-' + k).textContent = v.toFixed(stp * (mul || 1) < 0.01 ? 4 : stp * (mul || 1) < 0.1 ? 3 : 1).replace(/\.?0+$/, m => m.startsWith('.') && m.length > 1 ? '' : m); };
    el.value = params[k]; show(); el.oninput = () => { params[k] = +el.value; show(); drawSpin(); }; }); }
$('cond').onchange = e => { Object.assign(params, COND[e.target.value]); buildSliders(); };
$('physReset').onclick = () => { params = Object.assign({}, D); $('cond').value = 'normal'; buildSliders(); drawSpin(); };

/* ---------- sound (synthesized) ---------- */
let actx = null;
function snd(kind, speed) { if (!st.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const t0 = actx.currentTime, vol = Math.min(1, 0.08 + speed / 5), len = kind === 'cushion' ? 0.09 : kind === 'cue' ? 0.05 : 0.035;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * len), actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * (kind === 'cushion' ? 0.25 : 0.12)));
  const src = actx.createBufferSource(); src.buffer = buf; const f = actx.createBiquadFilter();
  f.type = kind === 'cushion' ? 'lowpass' : 'bandpass'; f.frequency.value = kind === 'ball' ? 3200 : kind === 'cue' ? 1500 : kind === 'land' ? 900 : 260; f.Q.value = kind === 'ball' ? 6 : 2;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + len); src.connect(f).connect(g).connect(actx.destination); src.start(t0);
  if (kind === 'ball') { const o = actx.createOscillator(), og = actx.createGain(); o.frequency.value = 2900; og.gain.setValueAtTime(vol * 0.35, t0); og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.05); o.connect(og).connect(actx.destination); o.start(t0); o.stop(t0 + 0.06); } }

/* ---------- shooting & playback ---------- */
function clearPaths() { pathLines.forEach(l => l.geometry.setFromPoints([])); $('verdict').textContent = '샷을 쳐보세요'; $('verdict').className = 'chip'; }
function shoot() { if (play || st.edit) return; snd('cue', 0); // unlock audio within the gesture
  before = balls.map(b => Object.assign({}, b, { q: b.q.slice() }));
  const shot = { phi: st.phi, V: cueSpeed(st.power), a: st.a, b: st.b, elev: st.elev * Math.PI / 180 };
  $('busy').hidden = false;
  setTimeout(() => { const t0 = performance.now(); const res = BP.simulate(params, before, shot); res.calcMs = performance.now() - t0; res.shot = shot; $('busy').hidden = true;
    last = res; strokeAnim = 1; startPlay(res, true); }, 30); }
function startPlay(res, withStroke) { play = { res, t: withStroke ? -0.35 : 0, speed: st.rspeed, evi: 0, stroke: withStroke }; balls = res.balls.map((b, k) => Object.assign({}, before[k])); clearPaths(); ui(); }
$('shoot').onclick = shoot;
$('replay').onclick = () => { if (!last || play) return; startPlay(last, false); };
$('retry').onclick = () => { if (!before || play) return; balls = before.map(b => Object.assign({}, b, { q: b.q.slice() })); syncBalls(); clearPaths(); last && (st.phi = last.shot.phi); ui(); };
function frameAt(res, t) { const f = res.frames, i = Math.min(f.length - 1, Math.max(0, t * params.recordHz)); const a = Math.floor(i), b = Math.min(f.length - 1, a + 1), u = i - a; return [f[a], f[b], u]; }
function stepPlay(dt) {
  const p = play; p.t += dt * p.speed;
  if (p.t < 0) { strokeAnim = Math.max(0, -p.t / 0.35); return; }
  if (p.stroke) { p.stroke = false; strokeAnim = 0; snd('cue', p.res.shot.V); }
  const res = p.res; const [fa, fb, u] = frameAt(res, p.t);
  for (let k = 0; k < 3; k++) { const o = k * 8; setBall(k, fa[o] + (fb[o] - fa[o]) * u, fa[o + 1] + (fb[o + 1] - fa[o + 1]) * u, fa[o + 2] + (fb[o + 2] - fa[o + 2]) * u, [fa[o + 3], fa[o + 4], fa[o + 5], fa[o + 6]]); }
  while (p.evi < res.events.length && res.events[p.evi].t <= p.t) { const e = res.events[p.evi++]; snd(e.type, e.speed); }
  if (st.path) drawPaths(res, p.t);
  if (p.t >= res.duration) { play = null; balls = res.balls.map(b => Object.assign({}, b, { q: b.q.slice(), vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0, still: true, air: false })); syncBalls(); showResult(res); ui(); } }
function drawPaths(res, t) { const n = Math.min(res.frames.length - 1, Math.floor(t * params.recordHz));
  for (let k = 0; k < 3; k++) { const pts = []; for (let i = 0; i <= n; i += 2) { const f = res.frames[i]; pts.push(T(f[k * 8], f[k * 8 + 1], 0.002)); } pathLines[k].geometry.setFromPoints(pts); } }

/* ---------- result & info ---------- */
function judge(res) { let cush = 0, hit = [], first = null, at2 = null;
  for (const e of res.events) { if (e.type === 'cushion' && e.i === 0) { if (!first) first = 'rail'; if (hit.length < 2) cush++; }
    if (e.type === 'ball' && (e.i === 0 || e.j === 0)) { const o = e.i === 0 ? e.j : e.i; if (!first) first = 'ball'; if (!hit.includes(o)) { hit.push(o); if (hit.length === 2) at2 = cush; } } }
  const ok = hit.length === 2 && at2 >= 3; return { ok, cush, at2, hit, first }; }
function showResult(res) { const j = judge(res), v = $('verdict');
  v.textContent = j.ok ? `득점 · 쿠션 ${j.at2}회${j.first === 'rail' ? ' (빈쿠션)' : ''}` : j.hit.length === 0 ? '실패 · 적구 못 맞힘' : j.hit.length === 1 ? `실패 · 제2적구 미스 (쿠션 ${j.cush})` : `실패 · 쿠션 ${j.at2}회`;
  v.className = 'chip ' + (j.ok ? 'good' : 'bad');
  const s = res.shot, b0 = res.frames[1], cueV = Math.hypot(b0[0] - res.frames[0][0], b0[1] - res.frames[0][1]) * params.recordHz;
  $('shotInfo').innerHTML = [['큐 속도', s.V.toFixed(2) + ' m/s'], ['수구 초속', cueV.toFixed(2) + ' m/s'], ['당점', spinLabel(s.a, s.b)], ['큐 기울기', Math.round(s.elev * 180 / Math.PI) + '°'],
    ['스쿼트', res.strike.squirtDeg.toFixed(2) + '°' + (res.strike.miscue ? ' · 미스큐!' : '')], ['진행 시간', res.duration.toFixed(1) + ' 초'], ['계산 시간', Math.round(res.calcMs) + ' ms']].map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');
  const nm = ['흰', '주황', '빨강'], side = ['왼쪽 단쿠션', '오른쪽 단쿠션', '아래 장쿠션', '위 장쿠션'];
  $('evList').innerHTML = res.events.filter(e => e.type !== 'land' || e.speed > 0.3).slice(0, 60).map(e => `<tr><td>${e.t.toFixed(2)}s</td><td>${e.type === 'ball' ? nm[e.i] + '↔' + nm[e.j] : e.type === 'cushion' ? nm[e.i] + ' → ' + side[e.side] : nm[e.i] + ' 착지'}</td><td>${e.speed.toFixed(2)} m/s</td></tr>`).join(''); }

/* ---------- loop ---------- */
let lastT = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (play) stepPlay(dt); else { syncBalls(); }
  updateGuide(); updateCue(); updateCamera(false); renderer.render(scene, camera); requestAnimationFrame(frame); }
buildSliders(); drawSpin(); ui(); syncBalls(); resize(); updateCamera(true); requestAnimationFrame(frame);
</script>
