<div id="app">
  <div id="view">
    <canvas id="cv" aria-label="당구대 (위에서 본 모습)"></canvas>
    <div id="topbar">
      <button class="chip" id="pathBtn" type="button" aria-pressed="true">궤적</button>
      <button class="chip" id="ghostBtn" type="button" aria-pressed="true">이전 샷 겹쳐보기</button>
      <button class="chip" id="guideBtn" type="button" aria-pressed="true">가이드</button>
      <button class="chip" id="numBtn" type="button" aria-pressed="true">다이아 숫자</button>
      <button class="chip" id="soundBtn" type="button" aria-pressed="true">소리</button>
      <span class="chip" id="verdict">샷을 쳐보세요</span>
    </div>
    <div class="chip" id="live" hidden></div>
    <div id="busy" hidden>계산 중…</div>
  </div>
  <aside id="panel">
    <div id="tabs" role="tablist">
      <button type="button" role="tab" data-t="shot" aria-selected="true">샷</button>
      <button type="button" role="tab" data-t="place">배치</button>
      <button type="button" role="tab" data-t="phys">물리</button>
      <button type="button" role="tab" data-t="info">기록</button>
    </div>
    <section class="tab" id="t-shot">
      <div id="spinWrap"><canvas id="spin" width="192" height="192" aria-label="당점"></canvas>
        <div style="display:flex;flex-direction:column;gap:4px;flex:1"><span class="lbl">당점</span><span id="spinTxt" class="num">중앙</span><button id="spinReset" type="button">중앙</button></div></div>
      <div><div class="row"><span class="lbl">큐 기울기</span><span class="num" id="elevTxt"></span></div><input id="elev" type="range" min="0" max="75" step="1" value="5" aria-label="큐 기울기"></div>
      <div><div class="row"><span class="lbl">힘 (큐 속도)</span><span class="num" id="powTxt"></span></div><input id="pow" type="range" min="0" max="1000" step="1" value="380" aria-label="힘"></div>
      <div><div class="row"><span class="lbl">조준</span><span class="num" id="angTxt"></span></div>
        <div class="g4"><button type="button" data-d="-1">◀◀</button><button type="button" data-d="-0.05">◀</button><button type="button" data-d="0.05">▶</button><button type="button" data-d="1">▶▶</button></div></div>
      <button id="shoot" type="button">샷</button>
      <div class="g3"><button id="retry" type="button">같은 배치</button><button id="replay" type="button">리플레이</button><button id="rspeed" type="button">1x</button></div>
      <p class="note">당구대를 누르면 그 지점으로 조준합니다. 나무 테두리(다이아몬드 줄)를 누르면 가장 가까운 0.1 다이아 지점으로 정확히 조준합니다.</p>
    </section>
    <section class="tab" id="t-place" hidden>
      <div class="g2"><button type="button" id="pBreak">초구 배치</button><button type="button" id="pRandom">랜덤 배치</button></div>
      <button type="button" id="pEdit" aria-pressed="false">공 옮기기 켜기</button>
      <button type="button" id="pSnap" aria-pressed="true">0.25 다이아 단위로 맞춤</button>
      <div class="field" id="posFields"></div>
      <p class="note">위치는 다이아몬드 단위입니다. 가로 0~8 (왼쪽 단쿠션 0), 세로 0~4 (아래 장쿠션 0).</p>
    </section>
    <section class="tab" id="t-phys" hidden>
      <div><span class="lbl">테이블 컨디션</span>
        <select id="cond" aria-label="테이블 컨디션"><option value="fast">빠른 대 (잘 구름)</option><option value="normal" selected>보통</option><option value="slow">무거운 대</option></select></div>
      <div id="sliders" style="display:flex;flex-direction:column;gap:6px"></div>
      <button type="button" id="physReset">기본값으로</button>
    </section>
    <section class="tab" id="t-info" hidden>
      <div class="kv" id="shotInfo"><span>아직 친 샷이 없습니다</span></div>
      <table class="ev"><tbody id="evList"></tbody></table>
    </section>
  </aside>
</div>
<script>
