<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쓰리쿠션 체험판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one-screen app. Landscape = scoreboard strip + table left, control rail right; portrait = table rotated vertical, controls below. Single committed "billiard lounge" look. */
:root{
  --bg:#141a22; --panel:#1d2530; --line:#2e3a4a; --fg:#e9eef4; --muted:#93a1b3;
  --brass:#d6a54a; --good:#4cc38a; --bad:#e2675b; --ink:#1b1408;
  --f-body:"IBM Plex Sans KR",system-ui,sans-serif; --f-num:"Barlow Condensed","IBM Plex Sans KR",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app{height:100%;display:grid;grid-template-columns:1fr 190px;position:relative}
#tableArea{display:flex;flex-direction:column;min-width:0;min-height:0}
#board{display:flex;gap:6px;padding:5px 8px;overflow-x:auto;flex:none}
.pl{display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;white-space:nowrap;color:var(--muted)}
.pl b{font-family:var(--f-num);font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.pl.cur{border-color:var(--brass);color:var(--fg);background:#2a2618}
.pl .fin{font-size:10px;font-weight:700;color:var(--ink);background:var(--brass);border-radius:4px;padding:0 4px}
#tableWrap{position:relative;flex:1;min-height:0}
#table{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,26,34,.92);border:1px solid var(--brass);
  color:var(--fg);padding:10px 18px;border-radius:10px;font-weight:700;font-size:18px;pointer-events:none;text-align:center}
#toast small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:8px 10px;overflow-y:auto;min-height:0}
#msg{font-size:12px;min-height:2.6em;color:var(--muted);line-height:1.3}
#msg.good{color:var(--good)} #msg.bad{color:var(--bad)} #msg.fin{color:var(--brass)}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between}
#spinBox{display:flex;align-items:center;gap:8px}
#spin{width:80px;height:80px;touch-action:none;border-radius:50%;flex:none}
#spinInfo{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
#power{position:relative;height:30px;border-radius:6px;background:#0f141b;border:1px solid var(--line);touch-action:none;overflow:hidden}
#powerFill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3d6b4f,var(--brass) 60%,var(--bad))}
#powerTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:16px;text-shadow:0 1px 2px #000}
.btnrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
button{font:inherit;color:var(--fg);background:#2a3442;border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:13px;touch-action:manipulation}
button:active{background:#36435a}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
#btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#shoot{grid-column:1/-1;background:var(--brass);color:var(--ink);font-weight:700;font-size:16px;padding:10px 0;border:0}
/* replay bar */
#replayBar{flex:none;background:rgba(17,22,29,.94);border-top:1px solid var(--line);padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#replayBar button{padding:5px 9px}
#rpInfo{flex:1 1 100%;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
#rpInfo b{color:var(--fg)}
#rpTrack{position:relative;flex:1;min-width:120px;height:26px}
#rpSlider{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--brass)}
#rpMarks{position:absolute;left:8px;right:8px;top:0;height:6px;pointer-events:none}
#rpMarks i{position:absolute;top:0;width:2px;height:6px;margin-left:-1px;background:var(--muted)}
#rpMarks i.b{background:var(--brass);height:8px}
/* overlays */
.overlay{position:absolute;inset:0;background:rgba(10,13,18,.86);display:flex;align-items:center;justify-content:center;padding:12px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.card h2{margin:0;font-size:18px;text-wrap:balance}
.card p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.prow .sw{width:12px;height:12px;border-radius:50%;background:var(--brass)}
.prow input{font:inherit;background:#0f141b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px}
.step span{font-family:var(--f-num);font-weight:700;font-size:20px;width:30px;text-align:center;font-variant-numeric:tabular-nums}
.primary{background:var(--brass);color:var(--ink);font-weight:700;border:0;padding:10px 0;font-size:16px}
table.rank{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rank th,table.rank td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.rank th:nth-child(-n+2),table.rank td:nth-child(-n+2){text-align:left}
table.rank th{font-weight:400;color:var(--muted);font-size:11px}
@media (orientation:portrait){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #panel{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 10px;
    grid-template-areas:"msg msg" "spin power" "spin aim" "btns btns";align-items:center;
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  #msg{grid-area:msg;min-height:1.3em} #spinBox{grid-area:spin} #powerBox{grid-area:power} #aimBox{grid-area:aim} #btns{grid-area:btns}
  #btns{grid-template-columns:2fr 1fr 1fr 1fr}#shoot{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body style="margin:0">
<div id="app">
  <div id="tableArea">
    <div id="board"></div>
    <div id="tableWrap">
      <canvas id="table" aria-label="당구대. 드래그해서 조준"></canvas>
      <div id="toast" hidden></div>
    </div>
    <div id="replayBar" hidden>
      <div id="rpInfo"><span id="rpTitle"></span><span id="rpDetail"></span></div>
      <button id="rpPrev" type="button" aria-label="이전 샷">◀</button>
      <button id="rpPlay" type="button">⏸</button>
      <div id="rpTrack"><div id="rpMarks"></div><input id="rpSlider" type="range" min="0" max="1000" value="0" aria-label="리플레이 위치"></div>
      <button id="rpNext" type="button" aria-label="다음 샷">▶</button>
      <button id="rpSpeed" type="button">1x</button>
      <button id="rpLoop" type="button" aria-pressed="true">반복</button>
      <button id="rpClose" type="button">닫기</button>
    </div>
  </div>
  <aside id="panel">
    <div id="msg">당구대를 드래그해서 조준하세요</div>
    <div id="spinBox">
      <canvas id="spin" width="160" height="160" aria-label="당점 선택"></canvas>
      <div id="spinInfo"><span class="lbl">당점</span><span id="spinTxt">중앙</span><button id="spinReset" type="button">중앙으로</button></div>
    </div>
    <div id="powerBox"><div class="lbl" style="margin-bottom:4px">힘</div>
      <div id="power" role="slider" aria-label="힘" tabindex="0"><div id="powerFill"></div><div id="powerTxt"></div></div></div>
    <div id="aimBox"><div class="row"><span class="lbl">미세 조준</span><span class="lbl" id="angTxt"></span></div>
      <div class="btnrow"><button type="button" data-d="-1">◀◀</button><button type="button" data-d="-0.1">◀</button><button type="button" data-d="0.1">▶</button><button type="button" data-d="1">▶▶</button></div></div>
    <div id="btns">
      <button id="shoot" type="button">샷</button>
      <button id="replay" type="button">리플레이</button>
      <button id="guide" type="button" aria-pressed="true">가이드</button>
      <button id="speed" type="button">1x</button>
      <button id="undo" type="button">되돌리기</button>
      <button id="menu" type="button">새 게임</button>
    </div>
  </aside>

  <div id="setup" class="overlay">
    <div class="card">
      <h2>쓰리쿠션 체험판</h2>
      <p>수구는 모두 흰 공, 적구는 주황·빨강. 제2적구를 맞히기 전에 쿠션 3번 이상이면 1점. 목표 점수를 채우면 <b>다이(쿠션)를 먼저 맞히는</b> 3쿠션으로 마무리해야 끝납니다.</p>
      <div><div class="lbl" style="margin-bottom:6px">인원 (폰 하나로 돌려 치기)</div>
        <div class="seg" id="segN"><button type="button" data-n="1">혼자 연습</button><button type="button" data-n="2">2명</button><button type="button" data-n="3" aria-pressed="true">3명</button></div></div>
      <div id="prows" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="primary" id="startBtn" type="button">시작</button>
    </div>
  </div>

  <div id="over" class="overlay" hidden>
    <div class="card">
      <h2 id="overTitle"></h2>
      <table class="rank"><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>이닝</th><th>애버리지</th><th>하이런</th></tr></thead><tbody id="overBody"></tbody></table>
      <div class="seg" style="grid-template-columns:1fr 1fr 1fr"><button type="button" id="overReplay">리플레이</button><button type="button" id="overSetup">설정 변경</button><button type="button" class="primary" id="overAgain">한 판 더</button></div>
    </div>
  </div>
</div>
<script>
// PHYSICS-START
const R=0.03075, L=2.84, W=1.42;
// 아케이드 튜닝: 실제보다 회전 효과(밀어치기·끌어치기·좌우 회전)를 과장
const G=9.81, MU_S=0.1, MU_R=0.011, SPIN_DEC=4, E_BALL=0.94, E_RAIL=0.8, MU_RAIL=0.45, RAIL_ROLL_KEEP=0.35;
const SPIN_GAIN=1.8, SIDE_GAIN=1.8, KICK=0.35;
// 쿠션마다 회전 손실 / 회전이 셀수록 쿠션 그립↑·구름 저항↓ (더 멀리 감)
const RAIL_SPIN_KEEP=0.85, RAIL_TOP_KEEP=0.85, SPIN_GRIP=0.3, SPIN_GLIDE=0.45;
function spinLevel(b){const sp=Math.hypot(b.vx,b.vy); return Math.min(1,Math.abs(R*b.wz)/(sp+0.4));}
const DT=1/1000;
function makeBalls(){return [
  {id:'w',x:0.71,y:0.71+0.1524,vx:0,vy:0,wx:0,wy:0,wz:0},
  {id:'o',x:0.71,y:0.71,vx:0,vy:0,wx:0,wy:0,wz:0},
  {id:'r',x:2.13,y:0.71,vx:0,vy:0,wx:0,wy:0,wz:0}];}
// a: side offset (-1..1, + = right english), b: vertical offset (-1..1, + = top). offsets scaled to 0.5R
function strike(b,ang,V,a,bv){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  b.vx=V*dx; b.vy=V*dy;
  const tb=0.5*bv, ta=0.5*a; // fraction of R
  const k=2.5*tb*V/R*SPIN_GAIN;
  b.wx=k*(-dy); b.wy=k*dx;
  b.wz=-2.5*ta*V/R*SIDE_GAIN;
}
function railHit(b,nx,ny){
  const vn=b.vx*nx+b.vy*ny; if(vn>=0) return false;
  const tx=-ny, ty=nx; let vt=b.vx*tx+b.vy*ty;
  const e=E_RAIL-Math.min(0.18,0.035*(-vn));
  const vn2=-e*vn;
  const s=vt-R*b.wz;
  const lvl=spinLevel(b);
  let dvt=-(2/7)*s; const lim=MU_RAIL*(1+SPIN_GRIP*lvl)*(1+e)*(-vn);
  if(dvt>lim)dvt=lim; if(dvt<-lim)dvt=-lim;
  vt+=dvt; b.wz+=-2.5*dvt/R; b.wz*=RAIL_SPIN_KEEP;
  let rvx=b.wy*R, rvy=-b.wx*R;
  let rvn=rvx*nx+rvy*ny; let rvt=rvx*tx+rvy*ty; rvn*=RAIL_ROLL_KEEP; rvt*=RAIL_TOP_KEEP;
  rvx=rvn*nx+rvt*tx; rvy=rvn*ny+rvt*ty; b.wy=rvx/R; b.wx=-rvy/R;
  b.vx=vn2*nx+vt*tx; b.vy=vn2*ny+vt*ty;
  return true;
}
function friction(b,dt){
  const cvx=b.vx-R*b.wy, cvy=b.vy+R*b.wx, sl=Math.hypot(cvx,cvy);
  if(sl>3.5*MU_S*G*dt){
    const fx=-MU_S*G*cvx/sl, fy=-MU_S*G*cvy/sl;
    b.vx+=fx*dt; b.vy+=fy*dt;
    b.wx+=2.5/R*fy*dt; b.wy+=-2.5/R*fx*dt;
  } else {
    b.vx-=(2/7)*cvx; b.vy-=(2/7)*cvy;
    const sp=Math.hypot(b.vx,b.vy), dec=MU_R*(1-SPIN_GLIDE*spinLevel(b))*G*dt;
    if(sp<=dec){b.vx=0;b.vy=0;} else {b.vx*=(sp-dec)/sp; b.vy*=(sp-dec)/sp;}
    b.wx=-b.vy/R; b.wy=b.vx/R;
  }
  const d=SPIN_DEC*dt; if(Math.abs(b.wz)<=d) b.wz=0; else b.wz-=Math.sign(b.wz)*d;
}
// 충돌 직후 남은 위/아래 회전을 즉시 일부 속도로 바꿔 '왕오시'·'히끼'가 시원하게 나가도록
function kick(b,nx,ny){if(!KICK)return; const vn=b.vx*nx+b.vy*ny; const rvn=(b.wy*R)*nx+(-b.wx*R)*ny; const d=KICK*(rvn-vn);
  b.vx+=d*nx; b.vy+=d*ny; const dw=2.5*d/R; b.wy-=dw*nx; b.wx-=dw*-ny;}
// returns true if anything still moving. ev(type, i, j)
function step(balls,dt,ev){
  for(const b of balls){b.x+=b.vx*dt; b.y+=b.vy*dt;}
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){
    const p=balls[i],q=balls[j]; let dx=q.x-p.x, dy=q.y-p.y; const d2=dx*dx+dy*dy;
    if(d2<4*R*R){const d=Math.sqrt(d2)||1e-9; const nx=dx/d, ny=dy/d;
      const rel=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;
      if(rel>0){const jj=(1+E_BALL)/2*rel; p.vx-=jj*nx;p.vy-=jj*ny;q.vx+=jj*nx;q.vy+=jj*ny; kick(p,nx,ny); kick(q,nx,ny); ev&&ev('ball',i,j);}
      const ov=(2*R-d)/2; p.x-=ov*nx;p.y-=ov*ny;q.x+=ov*nx;q.y+=ov*ny;}
  }
  balls.forEach((b,i)=>{
    if(b.x<R){b.x=R; if(railHit(b,1,0))ev&&ev('rail',i,0);}
    if(b.x>L-R){b.x=L-R; if(railHit(b,-1,0))ev&&ev('rail',i,1);}
    if(b.y<R){b.y=R; if(railHit(b,0,1))ev&&ev('rail',i,2);}
    if(b.y>W-R){b.y=W-R; if(railHit(b,0,-1))ev&&ev('rail',i,3);}
  });
  let moving=false;
  for(const b of balls){friction(b,dt);
    if(Math.hypot(b.vx,b.vy)<0.002 && R*Math.hypot(b.wx,b.wy)<0.004 && Math.abs(b.wz)<0.5){b.vx=b.vy=b.wx=b.wy=0;b.wz=0;} else moving=true;}
  return moving;
}
// PHYSICS-END
const T=0.115, CUSH=0.045, REC_DT=1/60;
const COLORS={w:['#ffffff','#c3c7cd'],o:['#ffb35c','#d65a0c'],r:['#ff5a4d','#a51d16']};
const BALLNAME=['흰 공','주황','빨강'];
const $=id=>document.getElementById(id);
let cfg={n:3,names:['A','B','C'],targets:[10,10,10]};
let st=null;            // game state (serializable, no replays)
let shots=[];           // replay records
let moving=false, history=[], trail=[], shotEv=null, acc=0, last=0, simT=0, rec=null, recAcc=0;
const cv=$('table'), ctx=cv.getContext('2d');
let M=null, dpr=1;

function newState(c){return {balls:makeBalls(),ang:0,power:0.4,sa:0,sb:0,guide:st?st.guide:true,speed:st?st.speed:1,
  players:c.names.slice(0,c.n).map((nm,i)=>({name:nm||'ABC'[i],target:c.targets[i],score:0,innings:0,run:0,high:0})),
  cur:0,phase:'play',shotNo:0,winner:-1};}
const P=()=>st.players[st.cur];
const finishing=p=>p.score>=p.target;
function aimDefault(){const c=st.balls[0],o=st.balls[2]; st.ang=Math.atan2(o.y-c.y,o.x-c.x);}

/* ---------- canvas geometry ---------- */
function resize(){dpr=window.devicePixelRatio||1; const w=cv.clientWidth,h=cv.clientHeight; if(!w||!h)return;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); const rot=h>w*1.05;
  const tw=(rot?W:L)+2*T, th=(rot?L:W)+2*T, pad=8; const s=Math.min((w-pad*2)/tw,(h-pad*2)/th);
  const ox=(w-tw*s)/2, oy=rot?pad:(h-th*s)/2;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(ox,oy); ctx.scale(s,s);
  if(rot){ctx.translate(W+2*T,0); ctx.rotate(Math.PI/2);} ctx.translate(T,T);
  M=ctx.getTransform(); draw();}
new ResizeObserver(resize).observe(cv);
function toWorld(e){const r=cv.getBoundingClientRect(); return new DOMPoint((e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr).matrixTransform(M.inverse());}
const locked=()=>moving||rp.on||st.phase!=='play';

/* ---------- input ---------- */
let aiming=false;
cv.addEventListener('pointerdown',e=>{if(locked())return; aiming=true; cv.setPointerCapture(e.pointerId); aimTo(e);});
cv.addEventListener('pointermove',e=>{if(aiming)aimTo(e);});
cv.addEventListener('pointerup',()=>aiming=false); cv.addEventListener('pointercancel',()=>aiming=false);
function aimTo(e){const p=toWorld(e), c=st.balls[0]; if(Math.hypot(p.x-c.x,p.y-c.y)<0.02)return; st.ang=Math.atan2(p.y-c.y,p.x-c.x); ui(); draw();}
document.querySelectorAll('#aimBox button').forEach(b=>{let t1,t2;
  const go=()=>{st.ang+=parseFloat(b.dataset.d)*Math.PI/180; ui(); draw();};
  b.addEventListener('pointerdown',e=>{e.preventDefault(); if(locked())return; go(); t1=setTimeout(()=>{t2=setInterval(go,60)},350);});
  const stop=()=>{clearTimeout(t1);clearInterval(t2)}; ['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,stop));});
const sc=$('spin'), sx=sc.getContext('2d');
function drawSpin(){const s=160,c=s/2,r=70; sx.clearRect(0,0,s,s);
  const g=sx.createRadialGradient(c-20,c-24,6,c,c,r); g.addColorStop(0,'#fff'); g.addColorStop(1,'#b8bec7');
  sx.fillStyle=g; sx.beginPath(); sx.arc(c,c,r,0,7); sx.fill();
  sx.strokeStyle='rgba(20,30,45,.35)'; sx.lineWidth=1.5; sx.beginPath(); sx.moveTo(c-r,c); sx.lineTo(c+r,c); sx.moveTo(c,c-r); sx.lineTo(c,c+r); sx.stroke();
  sx.setLineDash([4,4]); sx.beginPath(); sx.arc(c,c,r*0.5,0,7); sx.stroke(); sx.setLineDash([]);
  const px=c+st.sa*r*0.9, py=c-st.sb*r*0.9; sx.fillStyle='#c2362b'; sx.beginPath(); sx.arc(px,py,10,0,7); sx.fill(); sx.strokeStyle='#fff'; sx.lineWidth=2; sx.stroke();}
function spinTo(e){const r=sc.getBoundingClientRect(); let a=((e.clientX-r.left)/r.width*2-1)/0.9, b=-((e.clientY-r.top)/r.height*2-1)/0.9;
  const m=Math.hypot(a,b); if(m>1){a/=m;b/=m;} st.sa=Math.abs(a)<0.06?0:a; st.sb=Math.abs(b)<0.06?0:b; drawSpin(); ui();}
let spinning=false;
sc.addEventListener('pointerdown',e=>{if(locked())return; spinning=true; sc.setPointerCapture(e.pointerId); spinTo(e);});
sc.addEventListener('pointermove',e=>{if(spinning)spinTo(e);}); sc.addEventListener('pointerup',()=>spinning=false);
$('spinReset').onclick=()=>{st.sa=st.sb=0; drawSpin(); ui();};
const pw=$('power'); let pdrag=false;
function powTo(e){const r=pw.getBoundingClientRect(); st.power=Math.min(1,Math.max(0.02,(e.clientX-r.left)/r.width)); ui(); draw();}
pw.addEventListener('pointerdown',e=>{if(locked())return; pdrag=true; pw.setPointerCapture(e.pointerId); powTo(e);});
pw.addEventListener('pointermove',e=>{if(pdrag)powTo(e);}); pw.addEventListener('pointerup',()=>pdrag=false);
pw.addEventListener('keydown',e=>{if(e.key==='ArrowRight')st.power=Math.min(1,st.power+0.01); if(e.key==='ArrowLeft')st.power=Math.max(0.02,st.power-0.01); ui(); draw();});
const speedOf=p=>0.5+9.5*p*p;
$('guide').onclick=e=>{st.guide=!st.guide; e.currentTarget.setAttribute('aria-pressed',st.guide); draw();};
$('speed').onclick=e=>{st.speed=st.speed===1?2:st.speed===2?4:1; e.currentTarget.textContent=st.speed+'x';};
$('undo').onclick=()=>{if(locked()||!history.length)return; st=JSON.parse(history.pop()); shots.pop(); trail=[]; setMsg('한 샷 되돌렸습니다'); refresh();};
$('shoot').onclick=shoot;
$('replay').onclick=()=>openReplay(shots.length-1);
$('menu').onclick=()=>{if(moving)return; closeReplay(); showSetup();};

/* ---------- ui ---------- */
function setMsg(t,cls){const m=$('msg'); m.textContent=t; m.className=cls||'';}
let toastT;
function toast(h,sub){const t=$('toast'); t.innerHTML=h+(sub?'<small>'+sub+'</small>':''); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1600);}
function board(){$('board').innerHTML=st.players.map((p,i)=>`<div class="pl${i===st.cur&&st.phase==='play'?' cur':''}">${esc(p.name)} <b>${p.score}</b>/${p.target}${finishing(p)?' <span class="fin">마무리</span>':''}</div>`).join('')
  +`<div class="pl">이닝 <b>${P().innings}</b></div>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function spinLabel(sa,sb){const s=[]; if(sb>0.05)s.push('위 '+Math.round(sb*100)); if(sb<-0.05)s.push('아래 '+Math.round(-sb*100));
  if(sa>0.05)s.push('오른쪽 '+Math.round(sa*100)); if(sa<-0.05)s.push('왼쪽 '+Math.round(-sa*100)); return s.length?s.join(' · '):'중앙';}
function ui(){$('powerFill').style.width=(st.power*100)+'%';
  $('powerTxt').textContent=Math.round(st.power*100)+'%  ·  '+speedOf(st.power).toFixed(1)+' m/s';
  $('angTxt').textContent=(((st.ang*180/Math.PI)%360+360)%360).toFixed(1)+'°';
  $('spinTxt').textContent=spinLabel(st.sa,st.sb);}
function syncButtons(){const l=locked(); $('shoot').disabled=l; $('replay').disabled=moving||!shots.length;
  $('undo').hidden=st.players.length!==1; $('undo').disabled=l||!history.length; $('menu').disabled=moving;
  $('guide').setAttribute('aria-pressed',st.guide); $('speed').textContent=st.speed+'x';}
function refresh(){board(); ui(); drawSpin(); syncButtons(); draw();}
function turnMsg(){const p=P(); if(finishing(p))setMsg(p.name+' 마무리 샷: 다이(쿠션)를 먼저 맞힌 뒤 3쿠션','fin');
  else setMsg(p.name+' 차례 · '+(p.target-p.score)+'점 남음');}

/* ---------- shot ---------- */
function shoot(){if(locked())return; history.push(JSON.stringify(st)); if(history.length>30)history.shift();
  const c=st.balls[0]; const V=speedOf(st.power);
  rec={player:st.cur,name:P().name,no:++st.shotNo,finishing:finishing(P()),power:st.power,V,sa:st.sa,sb:st.sb,ang:st.ang,
    start:st.balls.map(b=>[b.x,b.y]),frames:[],marks:[],result:''};
  strike(c,st.ang,V,st.sa,st.sb);
  shotEv={cushions:0,hit:[],first:null,scored:false,cushAtSecond:null}; trail=[[c.x,c.y]];
  moving=true; simT=0; recAcc=0; pushFrame(); setMsg('…'); syncButtons(); last=performance.now(); acc=0; requestAnimationFrame(loop);}
function pushFrame(){const f=new Float32Array(6); st.balls.forEach((b,i)=>{f[i*2]=b.x;f[i*2+1]=b.y;}); rec.frames.push(f);}
function onEv(type,i,j){if(!shotEv)return;
  if(type==='rail'&&i===0){if(!shotEv.first)shotEv.first='rail'; if(shotEv.hit.length<2){shotEv.cushions++; rec.marks.push([simT,'c']);}}
  if(type==='ball'&&(i===0||j===0)){const o=i===0?j:i; if(!shotEv.first)shotEv.first='ball';
    if(!shotEv.hit.includes(o)){shotEv.hit.push(o); rec.marks.push([simT,'b']);
      if(shotEv.hit.length===2){shotEv.cushAtSecond=shotEv.cushions; if(shotEv.cushions>=3)shotEv.scored=true;}}}}
function loop(now){let dt=Math.min(0.05,(now-last)/1000)*st.speed; last=now; acc+=dt; let n=0;
  while(acc>=DT&&moving){moving=step(st.balls,DT,onEv); acc-=DT; simT+=DT; recAcc+=DT;
    if(recAcc>=REC_DT){recAcc-=REC_DT; pushFrame();}
    if(++n%12===0){const c=st.balls[0]; trail.push([c.x,c.y]);}}
  draw(); if(moving)requestAnimationFrame(loop); else endShot();}
function endShot(){const e=shotEv, p=P(); pushFrame(); trail.push([st.balls[0].x,st.balls[0].y]);
  let ok, why;
  if(rec.finishing){ok=e.scored&&e.first==='rail';
    why=ok?'마무리 성공!':e.first!=='rail'?'공부터 맞음 (다이 먼저여야 함)':e.hit.length<2?'제2적구 미스':'쿠션 부족 '+e.cushAtSecond+'회';}
  else{ok=e.scored; why=ok?'득점! 쿠션 '+e.cushAtSecond+'회'+(e.first==='rail'?' (빈쿠션)':''):e.hit.length===0?'적구를 못 맞힘':e.hit.length===1?'제2적구 미스 (쿠션 '+e.cushions+'회)':'쿠션 부족 '+e.cushAtSecond+'회';}
  const wasFin=rec.finishing; rec.ok=ok; rec.result=(ok?'⭕ ':'❌ ')+why; shots.push(rec); rec=null; shotEv=null;
  if(ok&&wasFin){ // finished the game
    st.phase='over'; st.winner=st.cur; p.run++; p.high=Math.max(p.high,p.run); refresh(); setMsg(p.name+' 마무리 성공!','good'); setTimeout(showOver,900); return;}
  if(ok){p.score++; p.run++; p.high=Math.max(p.high,p.run);
    if(finishing(p)){setMsg(why+' · 목표 달성! 이어서 마무리 샷 (다이 먼저)','fin'); toast('목표 달성!','마무리: 다이 먼저 맞히는 3쿠션');}
    else setMsg(why+' · 계속 치세요 ('+(p.target-p.score)+'점 남음)','good');}
  else{p.run=0; if(st.players.length>1)st.cur=(st.cur+1)%st.players.length; P().innings++; nextTurn(why);}
  refresh();}
function nextTurn(why){const q=P(); setMsg('실패 · '+why,'bad');
  if(st.players.length>1){toast(q.name+' 차례',finishing(q)?'마무리 샷: 다이 먼저':(q.target-q.score)+'점 남음'); setTimeout(()=>{if(!moving&&!rp.on)turnMsg();},1700);}}

/* ---------- drawing ---------- */
function draw(pos,tr){if(!M||!st)return; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
  const wg=ctx.createLinearGradient(0,-T,0,W+T); wg.addColorStop(0,'#6b4426'); wg.addColorStop(.5,'#4a2d17'); wg.addColorStop(1,'#6b4426');
  ctx.fillStyle=wg; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-T,-T,L+2*T,W+2*T,0.05):ctx.rect(-T,-T,L+2*T,W+2*T); ctx.fill();
  ctx.fillStyle='#174a8a'; ctx.fillRect(-CUSH,-CUSH,L+2*CUSH,W+2*CUSH);
  const cg=ctx.createRadialGradient(L/2,W/2,0.1,L/2,W/2,1.6); cg.addColorStop(0,'#2468bb'); cg.addColorStop(1,'#1a539b'); ctx.fillStyle=cg; ctx.fillRect(0,0,L,W);
  ctx.fillStyle='#efe6d2'; const dm=-CUSH-(T-CUSH)/2;
  for(let i=0;i<=8;i++){diamond(i*L/8,dm); diamond(i*L/8,W-dm);} for(let j=1;j<4;j++){diamond(dm,j*W/4); diamond(L-dm,j*W/4);}
  ctx.fillStyle='rgba(255,255,255,.35)'; [[0.71,0.71],[2.13,0.71],[1.42,0.71]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,0.006,0,7);ctx.fill();});
  const t=tr||trail;
  if(t.length>1){ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=0.008; ctx.beginPath(); ctx.moveTo(t[0][0],t[0][1]); t.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.stroke();}
  const balls=pos?st.balls.map((b,i)=>({id:b.id,x:pos[i*2],y:pos[i*2+1]})):st.balls;
  if(!pos&&!moving&&st.phase==='play'){if(st.guide)drawGuide(); drawCue();}
  balls.forEach((b,i)=>{ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(b.x+0.006,b.y+0.008,R,0,7); ctx.fill();
    const g=ctx.createRadialGradient(b.x-R*0.35,b.y-R*0.4,R*0.1,b.x,b.y,R); g.addColorStop(0,COLORS[b.id][0]); g.addColorStop(1,COLORS[b.id][1]);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,R,0,7); ctx.fill();});}
function diamond(x,y){const s=0.012; ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s*0.7,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s*0.7,y); ctx.closePath(); ctx.fill();}
function cast(px,py,dx,dy){let best=Infinity,hit=null;
  st.balls.forEach((b,i)=>{if(i===0)return; const ox=px-b.x, oy=py-b.y; const bq=ox*dx+oy*dy, cq=ox*ox+oy*oy-4*R*R, disc=bq*bq-cq;
    if(disc>0){const t=-bq-Math.sqrt(disc); if(t>1e-6&&t<best){best=t;hit={type:'ball',i};}}});
  [[dx<0,(R-px)/dx,'x'],[dx>0,(L-R-px)/dx,'x'],[dy<0,(R-py)/dy,'y'],[dy>0,(W-R-py)/dy,'y']].forEach(([ok,t,ax])=>{if(ok&&t>1e-6&&t<best){best=t;hit={type:'rail',ax};}});
  return {t:best,hit};}
function drawGuide(){const c=st.balls[0]; const dx=Math.cos(st.ang), dy=Math.sin(st.ang);
  const r=cast(c.x,c.y,dx,dy); const ex=c.x+dx*r.t, ey=c.y+dy*r.t;
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=0.004; ctx.setLineDash([0.02,0.014]);
  ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.beginPath(); ctx.arc(ex,ey,R,0,7); ctx.stroke(); ctx.setLineDash([]);
  if(r.hit&&r.hit.type==='ball'){const b=st.balls[r.hit.i]; let nx=b.x-ex, ny=b.y-ey; const m=Math.hypot(nx,ny); nx/=m; ny/=m;
    ctx.strokeStyle='rgba(214,165,74,.8)'; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+nx*0.25,b.y+ny*0.25); ctx.stroke();}
  else if(r.hit){const rx=r.hit.ax==='x'?-dx:dx, ry=r.hit.ax==='y'?-dy:dy; ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex+rx*0.35,ey+ry*0.35); ctx.stroke();}}
function drawCue(){const c=st.balls[0]; const dx=Math.cos(st.ang), dy=Math.sin(st.ang); const g=R+0.015+st.power*0.13;
  const sx0=c.x-dx*g, sy0=c.y-dy*g, sx1=c.x-dx*(g+1.3), sy1=c.y-dy*(g+1.3);
  const lg=ctx.createLinearGradient(sx0,sy0,sx1,sy1); lg.addColorStop(0,'#e9eef2'); lg.addColorStop(0.012,'#e9eef2'); lg.addColorStop(0.015,'#d9b77a'); lg.addColorStop(0.6,'#a8763c'); lg.addColorStop(0.62,'#2a1a10'); lg.addColorStop(1,'#1a100a');
  ctx.strokeStyle=lg; ctx.lineCap='round';
  for(let k=0;k<6;k++){const f0=k/6,f1=(k+1)/6; ctx.lineWidth=0.011+0.012*f0; ctx.beginPath(); ctx.moveTo(sx0+(sx1-sx0)*f0,sy0+(sy1-sy0)*f0); ctx.lineTo(sx0+(sx1-sx0)*f1,sy0+(sy1-sy0)*f1); ctx.stroke();}
  ctx.lineCap='butt';}

/* ---------- replay ---------- */
const rp={on:false,idx:0,t:0,playing:true,speed:1,loop:true,raf:0,last:0};
function openReplay(i){if(moving||!shots.length)return; $('over').hidden=true; rp.on=true; rp.idx=Math.max(0,Math.min(i,shots.length-1));
  rp.t=0; rp.playing=true; $('replayBar').hidden=false; setupShot(); syncButtons(); rp.last=performance.now(); cancelAnimationFrame(rp.raf); rp.raf=requestAnimationFrame(rpLoop);}
function closeReplay(){if(!rp.on)return; rp.on=false; cancelAnimationFrame(rp.raf); $('replayBar').hidden=true; syncButtons(); draw();
  if(st.phase==='over')showOver();}
function setupShot(){const s=shots[rp.idx]; const dur=(s.frames.length-1)*REC_DT;
  $('rpTitle').innerHTML=`<b>#${s.no} ${esc(s.name)}</b>${s.finishing?' · 마무리':''} · ${esc(s.result)}`;
  $('rpDetail').textContent=`힘 ${Math.round(s.power*100)}% · ${spinLabel(s.sa,s.sb)} · ${(((s.ang*180/Math.PI)%360+360)%360).toFixed(1)}°`;
  $('rpMarks').innerHTML=s.marks.map(([t,k])=>`<i class="${k}" style="left:${(t/dur*100).toFixed(2)}%"></i>`).join('');
  $('rpPrev').disabled=rp.idx===0; $('rpNext').disabled=rp.idx===shots.length-1; $('rpPlay').textContent=rp.playing?'⏸':'▶';}
function rpDraw(){const s=shots[rp.idx]; const n=s.frames.length; const fi=Math.min(n-1,rp.t/REC_DT); const a=Math.floor(fi), b=Math.min(n-1,a+1), u=fi-a;
  const fa=s.frames[a], fb=s.frames[b]; const pos=Array.from(fa,(v,k)=>v+(fb[k]-v)*u);
  const tr=[]; for(let k=0;k<=a;k+=3)tr.push([s.frames[k][0],s.frames[k][1]]); tr.push([pos[0],pos[1]]);
  draw(pos,tr); $('rpSlider').value=Math.round(fi/(n-1||1)*1000);}
function rpLoop(now){if(!rp.on)return; const dt=Math.min(0.05,(now-rp.last)/1000); rp.last=now; const s=shots[rp.idx]; const dur=(s.frames.length-1)*REC_DT;
  if(rp.playing){rp.t+=dt*rp.speed; if(rp.t>=dur){if(rp.loop){rp.t=dur; rpDraw(); rp.hold=(rp.hold||0)+dt; if(rp.hold>0.8){rp.hold=0; rp.t=0;}}else{rp.t=dur; rp.playing=false; $('rpPlay').textContent='▶';}}}
  rpDraw(); rp.raf=requestAnimationFrame(rpLoop);}
$('rpPlay').onclick=()=>{const s=shots[rp.idx]; if(!rp.playing&&rp.t>=(s.frames.length-1)*REC_DT)rp.t=0; rp.playing=!rp.playing; $('rpPlay').textContent=rp.playing?'⏸':'▶';};
$('rpPrev').onclick=()=>{rp.idx--; rp.t=0; rp.playing=true; setupShot();};
$('rpNext').onclick=()=>{rp.idx++; rp.t=0; rp.playing=true; setupShot();};
$('rpSpeed').onclick=e=>{rp.speed=rp.speed===1?0.5:rp.speed===0.5?0.25:rp.speed===0.25?2:1; e.currentTarget.textContent=rp.speed+'x';};
$('rpLoop').onclick=e=>{rp.loop=!rp.loop; e.currentTarget.setAttribute('aria-pressed',rp.loop);};
$('rpClose').onclick=closeReplay;
$('rpSlider').addEventListener('input',e=>{const s=shots[rp.idx]; rp.t=e.target.value/1000*(s.frames.length-1)*REC_DT; rp.playing=false; $('rpPlay').textContent='▶';});

/* ---------- setup / game over ---------- */
function showSetup(){$('over').hidden=true; $('setup').hidden=false; renderRows();}
function renderRows(){document.querySelectorAll('#segN button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===cfg.n));
  $('prows').innerHTML=Array.from({length:cfg.n},(_,i)=>`<div class="prow"><span class="sw"></span>
    <input id="nm${i}" maxlength="8" value="${esc(cfg.names[i])}" aria-label="플레이어 ${i+1} 이름">
    <div class="step"><button type="button" data-i="${i}" data-d="-1" aria-label="목표 줄이기">−</button><span id="tg${i}">${cfg.targets[i]}</span><button type="button" data-i="${i}" data-d="1" aria-label="목표 늘리기">+</button><span class="lbl" style="width:auto">점</span></div></div>`).join('');
  $('prows').querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i; readNames(); cfg.targets[i]=Math.max(1,Math.min(50,cfg.targets[i]+ +b.dataset.d)); $('tg'+i).textContent=cfg.targets[i];});}
function readNames(){for(let i=0;i<cfg.n;i++){const el=$('nm'+i); if(el)cfg.names[i]=el.value.trim()||'ABC'[i];}}
document.querySelectorAll('#segN button').forEach(b=>b.onclick=()=>{readNames(); cfg.n=+b.dataset.n; renderRows();});
$('startBtn').onclick=()=>{readNames(); startGame();};
function startGame(){st=newState(cfg); st.players[0].innings=1;
  shots=[]; history=[]; trail=[]; aimDefault(); $('setup').hidden=true; $('over').hidden=true; closeReplay(); refresh(); turnMsg();
  if(st.players.length>1)toast(P().name+' 먼저',(P().target)+'점 목표');}
function avg(p){return p.innings?p.score/p.innings:0;}
function showOver(){if(rp.on)return; const w=st.players[st.winner];
  const order=st.players.map((p,i)=>i).sort((a,b)=>a===st.winner?-1:b===st.winner?1:(st.players[b].score/st.players[b].target-st.players[a].score/st.players[a].target)||(avg(st.players[b])-avg(st.players[a])));
  $('overTitle').textContent=w.name+' 승리 · 마무리 성공';
  $('overBody').innerHTML=order.map((i,k)=>{const p=st.players[i]; return `<tr><td>${k+1}</td><td>${esc(p.name)}</td><td>${p.score}/${p.target}</td><td>${p.innings}</td><td>${avg(p).toFixed(3)}</td><td>${p.high}</td></tr>`;}).join('');
  $('over').hidden=false;}
$('overReplay').onclick=()=>openReplay(shots.length-1);
$('overSetup').onclick=showSetup;
$('overAgain').onclick=startGame;

/* ---------- boot ---------- */
function start(data){if(data&&data.st){st=data.st; cfg=data.cfg||cfg; $('setup').hidden=true; aiming=false; refresh(); turnMsg(); if(st.phase==='over')showOver(); resize(); return;}
  st=newState(cfg); st.players[0].innings=1; aimDefault(); refresh(); showSetup(); resize();}
window.claude?.hot?.snapshot?.(()=>({st:moving?null:st,cfg}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script></body></html>
